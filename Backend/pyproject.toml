[project]
name = "pdf-extractor"
version = "0.1.0"
description = "Extract text from pdf"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "tesseract>=0.1.3",
    "uvicorn[standard]>=0.52.4",
]

[tool.fastapi]
entrypoint = "src.main:app"
